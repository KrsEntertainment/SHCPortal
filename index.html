<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Школьный портал</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <!-- ЭКРАН ВХОДА -->
  <div id="login" class="login-wrap">
    <div id="boot-preloader" style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#fff;color:#475569;font-family:Segoe UI,system-ui,sans-serif">
      <div style="font-size:46px">🎓</div>
      <div style="font-weight:700;font-size:17px;color:#1e293b">Загрузка Школьного портала…</div>
      <div style="width:220px;height:6px;border-radius:99px;background:#e2e8f0;overflow:hidden"><div style="width:40%;height:100%;background:#4f46e5;border-radius:99px;animation:loadbar 1s ease-in-out infinite"></div></div>
    </div>
    <style>@keyframes loadbar{0%{margin-left:-40%}100%{margin-left:100%}}</style>
  </div>
  <script>
    // Последний рубеж защиты от белого экрана — показываем текст ошибки
    window.addEventListener('error', function(e){
      var l=document.getElementById('login');
      if(l && (!l.querySelector('.login-aside'))){
        l.innerHTML='<div style="padding:40px;max-width:560px;margin:auto;font-family:Segoe UI,system-ui,sans-serif;color:#1e293b">'+
          '<div style="font-size:42px;margin-bottom:12px">⚠️</div>'+
          '<h2 style="margin-bottom:8px">Не удалось запустить портал</h2>'+
          '<pre style="white-space:pre-wrap;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;padding:12px;font-size:12px;color:#be123c;overflow:auto">'+
          String(e && e.message || e) + (e && e.filename ? ('\n('+e.filename.split("/").pop()+':'+e.lineno+')') : '') +'</pre>'+
          '<p style="color:#64748b;margin-top:12px;font-size:13px">Обновите страницу (Ctrl+F5). Если ошибка повторяется — сообщите текст выше.</p></div>';
      }
    });
  </script>

  <!-- ПРИЛОЖЕНИЕ -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">🎓</div>
        <div class="brand-text">
          <strong>Школьный портал</strong>
          <span id="sb-school">…</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="user-mini" id="sb-user"></div>
        <button type="button" class="btn-ghost-light" data-act="logout">
          <svg viewBox="0 0 24 24" class="ic"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Выйти
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="burger" id="burger" type="button" aria-label="Меню">
          <span></span><span></span><span></span>
        </button>
        <h1 id="page-title">Обзор</h1>
        <div class="topbar-right" id="tb-user"></div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- МОДАЛКИ И ТОСТЫ -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="main.js"></script>
</body>
</html>
